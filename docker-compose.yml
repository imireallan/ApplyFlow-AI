services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - ai_engine

  frontend:
    image: 739275457094.dkr.ecr.us-east-1.amazonaws.com/applyflow-frontend
    env_file: .env

  ai_engine:
    image: 739275457094.dkr.ecr.us-east-1.amazonaws.com/applyflow-ai-engine
    env_file: .env

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: applyflow_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
