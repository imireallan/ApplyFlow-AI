name: Deploy ApplyFlow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/applyflow"
          rm: true

      - name: Create env file
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/applyflow
            echo "${{ secrets.ENV_FILE }}" > /home/ec2-user/applyflow/.env

      - name: Deploy containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/applyflow

            docker compose down

            docker compose build --no-cache

            docker compose up -d db

            echo "Waiting for DB..."
            sleep 8

            docker compose up -d ai_engine

            docker compose exec ai_engine alembic upgrade head

            docker compose up -d
