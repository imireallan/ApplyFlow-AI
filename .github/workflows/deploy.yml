name: Deploy ApplyFlow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Verify imports
        run: |
          if git grep "~/lib" -- ':!.github'; then
            echo "Old imports detected"
            exit 1
          fi

      # Build and push backend image
      - name: Build and push ai_engine image
        run: |
          docker build -t ai_engine ./ai_engine
          docker tag ai_engine:latest ${{ secrets.ECR_AI_ENGINE_URI }}:latest
          docker push ${{ secrets.ECR_AI_ENGINE_URI }}:latest

      # Build and push frontend image
      - name: Build and push frontend image
        run: |
          docker build -t frontend \
            --build-arg VITE_AI_API_URL=${{ secrets.VITE_AI_API_URL }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
            --build-arg VITE_PUBLIC_POSTHOG_TOKEN=${{ secrets.VITE_PUBLIC_POSTHOG_TOKEN }} \
            --build-arg VITE_PUBLIC_POSTHOG_HOST=${{ secrets.VITE_PUBLIC_POSTHOG_HOST }} \
            ./frontend
          docker tag frontend:latest ${{ secrets.ECR_FRONTEND_URI }}:latest
          docker push ${{ secrets.ECR_FRONTEND_URI }}:latest

      # Deploy on EC2
      - name: Deploy containers on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e

            # Ensure the .ssh directory exists
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh

            # Add GitHub to known_hosts to prevent "Host key verification failed"
            ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
            
            APP_DIR=/home/ec2-user/applyflow

            # Check if directory exists and is a git repo; if not, clone it
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repository not found. Cloning..."
              git clone ${{ secrets.REPO_URL }} $APP_DIR
            fi

            cd $APP_DIR

            # Ensure we have the latest docker-compose.yml and local files
            git pull origin main

            # Update environment variables
            echo "${{ secrets.ENV_FILE }}" > .env

            # Authenticate Docker with ECR
            aws ecr get-login-password --region us-east-1 \
                | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Refresh images and restart services
            docker compose pull
            docker compose down

            # Start DB first and run migrations
            docker compose up -d db
            echo "Waiting for DB..."
            sleep 10

            docker compose run --rm ai_engine alembic upgrade head

            # Bring everything else up
            docker compose up -d