[project]
name = "ai-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web / API
    "uvicorn==0.40.0",
    "python-multipart==0.0.22",
    "email-validator==2.3.0",
    "pydantic>=2.13.5",
    "pyjwt==2.11.0",
    "python-dotenv==1.2.1",
    "httpx==0.28.1",
    "requests==2.32.5",
    # Database
    "sqlalchemy==2.0.46",
    "alembic==1.18.4",
    "psycopg2-binary==2.9.11",
    # LLM / agents
    "langchain==1.2.10",
    "langchain-classic==1.0.1",
    "langchain-community==0.4.1",
    "langchain-core==1.2.12",
    "langchain-groq==1.1.2",
    "langchain-openai==1.1.9",
    "langchain-pinecone==0.2.13",
    "langchain-text-splitters==1.1.0",
    "langgraph==1.0.8",
    "langgraph-checkpoint==4.0.0",
    "langgraph-prebuilt==1.0.7",
    "langgraph-sdk==0.3.5",
    "langsmith==0.7.1",
    "groq==0.37.1",
    "openai==2.20.0",
    "pinecone==7.3.0",
    "tiktoken==0.12.0",
    # Embeddings (replaces torch + sentence-transformers)
    "fastembed>=0.7",
    # Documents
    "pypdf==6.7.0",
    # Auth
    "google-auth==2.48.0",
    "fastapi[standard]>=0.152.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output=3
force_grid_wrap=0

[tool.flake8]
max-line-length = 88
ignore = "E501,W503,E203"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
show_error_codes = true
exclude = [".venv/", "migrations/"]
check_untyped_defs = false
disallow_subclassing_any = false
plugins = ['pydantic.mypy']

# Ignore alembic migrations if you use them
[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
