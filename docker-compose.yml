services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - ai_engine

  frontend:
    build:
      context: ./frontend
      target: production
    expose:
      - "3000"
    env_file: .env

  ai_engine:
    build:
      context: ./ai_engine
      target: production
    expose:
      - "8000"
    env_file: .env

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: applyflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
