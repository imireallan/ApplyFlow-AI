name: Deploy ApplyFlow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Verify imports
        run: |
          if git grep "~/lib" -- ':!.github'; then
            echo "Old imports detected"
            exit 1
          fi

      # Build and push backend image
      - name: Build and push ai_engine image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_engine
          push: true
          tags: |
            ${{ secrets.ECR_AI_ENGINE_URI }}:latest
            ${{ secrets.ECR_AI_ENGINE_URI }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.ECR_AI_ENGINE_URI }}:cache
          cache-to: type=registry,ref=${{ secrets.ECR_AI_ENGINE_URI }}:cache,mode=max

      # Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ECR_FRONTEND_URI }}:latest
            ${{ secrets.ECR_FRONTEND_URI }}:${{ github.sha }}
          build-args: |
            VITE_AI_API_URL=${{ secrets.VITE_AI_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_PUBLIC_POSTHOG_TOKEN=${{ secrets.VITE_PUBLIC_POSTHOG_TOKEN }}
            VITE_PUBLIC_POSTHOG_HOST=${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
          cache-from: type=registry,ref=${{ secrets.ECR_FRONTEND_URI }}:cache
          cache-to: type=registry,ref=${{ secrets.ECR_FRONTEND_URI }}:cache,mode=max

      # Deploy on EC2
      - name: Deploy containers on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -euxo pipefail

            APP_DIR=/home/ec2-user/applyflow

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone ${{ secrets.REPO_URL }} $APP_DIR
            fi

            cd $APP_DIR

            docker compose pull
            git pull origin main

            cat <<EOF > .env
            ${{ secrets.ENV_FILE }}
            EOF

            aws ecr get-login-password --region us-east-1 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker compose up -d db

            echo "Waiting for DB..."
            until docker compose exec db pg_isready -U postgres; do
              sleep 2
            done

            docker compose up -d --remove-orphans

            docker compose exec ai_engine alembic upgrade head