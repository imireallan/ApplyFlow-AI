name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────── Unit & Component Tests ───────────────
  vitest:
    name: Vitest (unit + component + route)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run vitest with coverage
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile=vitest-results.json
        env:
          CI: true

      - name: Upload vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: frontend/vitest-results.json
          retention-days: 30

  # ─────────────── E2E Tests ───────────────
  playwright:
    name: Playwright (e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps

      - name: Run Playwright tests
        run: npx playwright test --project=chromium* --retries=2
        env:
          CI: true
          VITE_AI_API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # ─────────────── Status Aggregation ───────────────
  report:
    name: CI Status
    needs: [vitest, playwright]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== CI Results ==="
          if [ "${{ needs.vitest.result }}" == "failure" ]; then
            echo "::error::Vitest tests failed"
          fi
          if [ "${{ needs.playwright.result }}" == "failure" ]; then
            echo "::error::Playwright tests failed"
          fi
          if [ "${{ needs.vitest.result }}" == "failure" ] || [ "${{ needs.playwright.result }}" == "failure" ]; then
            exit 1
          fi
          echo "All tests passed!"
