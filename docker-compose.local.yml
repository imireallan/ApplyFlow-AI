services:
  frontend:
    build:
      context: ./frontend
      # run the dev version locally
      target: development-dependencies-env
    ports:
      - "5173:5173"
      - "5679:5678"
    env_file:
      - .env
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules # prevents local node_modules from overwriting container ones
    depends_on:
      ai_engine:
        condition: service_healthy
  ai_engine:
    build:
      context: ./ai_engine
      target: development
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./ai_engine:/app
    env_file: .env
    healthcheck:
      # test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    #depends_on:
    #  - db  # Remove hard dependency - uses EXTERNAL_DB_URL or POSTGRES_HOST from env
  # nudger:
  #   build: ./nudger
  #   volumes:
  #     - ./nudger:/app
  #   env_file: .env
  #   command: npm run dev
    #depends_on:
    #  - db  # Remove hard dependency - uses POSTGRES_HOST from env
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: applyflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
