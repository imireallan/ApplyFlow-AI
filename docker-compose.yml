services:
  frontend:
    build:
      context: ./frontend
      # run the dev version locally
      target: development-dependencies-env
    ports:
      - "5173:5173"
      - "5679:5678"
    environment:
      - VITE_AI_API_URL=http://ai_engine:8000
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules # prevents local node_modules from overwriting container ones
    depends_on:
      ai_engine:
        condition: service_healthy
  ai_engine:
    build:
      context: ./ai_engine
      target: development
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./ai_engine:/app
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      - db
  nudger:
    build: ./nudger
    volumes:
      - ./nudger:/app
    env_file: .env
    command: npm run dev
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: applyflow_db
      POSTGRES_USER: allan_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
