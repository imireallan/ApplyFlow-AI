name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai_engine/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_engine/requirements_dev.txt

      - name: Install dev deps
        run: |
          pip install flake8

      - name: Run flake8
        run: flake8 api/ core/ models/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy pydantic

      - name: Run mypy
        run: mypy core/ api/ models/ tests/ --ignore-missing-imports --no-warn-no-return --follow-imports=skip --disable-error-code=valid-type --disable-error-code=return-value

  pytest:
    name: Pytest (unit + api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai_engine/requirements.txt
            ai_engine/requirements_dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Run pytest
        run: pytest --junitxml=junit.xml -v
        env:
          PINECONE_INDEX_NAME_DEV: test-dev
          PINECONE_INDEX_NAME_PROD: test-prod
          PINECONE_API_KEY: fake-pinecone-key
          JWT_SECRET: fake-jwt-secret-for-testing
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: ai_engine/junit.xml
          retention-days: 30

