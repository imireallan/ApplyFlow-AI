[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output=3
force_grid_wrap=0

[tool.flake8]
max-line-length = 88
ignore = "E501,W503,E203"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
show_error_codes = true
check_untyped_defs = true
disallow_subclassing_any = false
plugins = ['pydantic.mypy']

# Ignore alembic migrations if you use them
[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
