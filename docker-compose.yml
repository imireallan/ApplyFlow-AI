services:
  frontend:
    build:
      context: ./frontend
      target: production-dependencies-env
    ports:
      - "80:3000"
    env_file: .env
    depends_on:
      - ai_engine

  ai_engine:
    build:
      context: ./ai_engine
      target: production
    ports:
      - "8000:8000"
    env_file: .env

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: applyflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
