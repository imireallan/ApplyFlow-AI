name: Deploy ApplyFlow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify imports
        run: |
          if git grep "~/lib" -- ':!.github'; then
            echo "Old imports detected"
            exit 1
          fi

      - name: Login to Google Container Registry
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ai_engine image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_engine
          target: production
          push: true
          tags: |
            gcr.io/applyflow-488416/applyflow-ai-engine:latest
            gcr.io/applyflow-488416/applyflow-ai-engine:${{ github.sha }}
          cache-from: type=registry,ref=gcr.io/applyflow-488416/applyflow-ai-engine:cache
          cache-to: type=registry,ref=gcr.io/applyflow-488416/applyflow-ai-engine:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            gcr.io/applyflow-488416/applyflow-frontend:latest
            gcr.io/applyflow-488416/applyflow-frontend:${{ github.sha }}
          build-args: |
            VITE_AI_API_URL=${{ secrets.VITE_AI_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_PUBLIC_POSTHOG_TOKEN=${{ secrets.VITE_PUBLIC_POSTHOG_TOKEN }}
            VITE_PUBLIC_POSTHOG_HOST=${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
          cache-from: type=registry,ref=gcr.io/applyflow-488416/applyflow-frontend:cache
          cache-to: type=registry,ref=gcr.io/applyflow-488416/applyflow-frontend:cache,mode=max

      - name: Deploy containers on GCP
        uses: appleboy/ssh-action@v1.0.0
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.GCP_HOST }}
          username: debian
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 60m
          envs: IMAGE_TAG
          script: |
            set -euxo pipefail

            APP_DIR=/home/debian/applyflow
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone ${{ secrets.REPO_URL }} $APP_DIR
            fi
            cd $APP_DIR
            git fetch origin main && git reset --hard origin/main

            printf "%s" "${{ secrets.ENV_FILE }}" > .env

            C="docker compose -f docker-compose.prod.yml"
            gcloud auth configure-docker gcr.io --quiet
            $C pull

            $C up -d db
            timeout 60 bash -c "until $C exec -T db pg_isready -U postgres; do sleep 2; done"

            $C run --rm --no-deps -T ai_engine alembic upgrade head

            $C up -d --remove-orphans --wait
            docker image prune -f
            $C ps