version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      # run the dev version locally
      target: development-dependencies-env
    ports:
      - "5173:5173"
    environment:
      - VITE_AI_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      ai_engine:
        condition: service_healthy
  ai_engine:
    build: ./ai_engine
    ports:
      - "8000:8000"
    volumes:
      - ./ai_engine:/app
    env_file: .env
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - db
  nudger:
    build: ./nudger
    volumes:
      - ./nudger:/app
    env_file: .env
    command: npm run dev
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: applyflow_db
      POSTGRES_USER: allan_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
