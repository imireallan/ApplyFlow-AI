name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai_engine/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest (unit + api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_engine/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Lint (flake8)
        run: |
          flake8 api/ core/ models/ --max-line-length=120 --extend-ignore=E501

      - name: Type check (mypy)
        run: |
          mypy core/ api/ models/ --ignore-missing-imports --no-warn-no-return

      - name: Run pytest
        run: pytest --junitxml=junit.xml -v
        env:
          PINECONE_INDEX_NAME_DEV: test-dev
          PINECONE_INDEX_NAME_PROD: test-prod
          PINECONE_API_KEY: fake-pinecone-key
          JWT_SECRET: fake-jwt-secret-for-testing
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ai_engine/junit.xml
          retention-days: 30

